<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign in — NovaAI</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

<a href="index.html" class="back-home">
    ← Back to NovaAI
</a>

<main class="auth-page">

    <div class="auth-visual">

        <div class="visual-orb">
            ✦
        </div>

        <div class="visual-ring"></div>

        <div class="visual-copy">

            <span>WELCOME BACK</span>

            <h1>
                Continue where
                <em>ideas begin.</em>
            </h1>

            <p>
                Your workspace, conversations and
                creative momentum are waiting.
            </p>

        </div>

    </div>


    <div class="auth-panel">

        <div class="auth-box">

            <a href="index.html" class="auth-logo">
                <span>✦</span>
                NovaAI
            </a>

            <h2>
                Welcome back
            </h2>

            <p class="auth-subtitle">
                Sign in to continue to your workspace.
            </p>


            <!-- Demo Google button -->

            <button type="button"
                    class="google-button">

                <span class="google-g">
                    G
                </span>

                Continue with Google

            </button>


            <div class="divider">
                <span>or continue with email</span>
            </div>


            <form>

                <label>
                    Email address
                </label>

                <input
                    type="email"
                    placeholder="you@example.com"
                    required
                >


                <div class="password-row">

                    <label>
                        Password
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >


                <a href="dashboard.html" class="login-btn">
    Continue to NOVA
</a>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>

            </p>

        </div>

    </div>

</main>

</body>
</html>
